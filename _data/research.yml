#  TO ADD A PAPER
#    1. Copy an existing paper: every line from its "- title:" down to the
#       line just before the next "- title:".
#    2. Paste it where it should appear and change the text.
#    3. Delete any lines you don't need (for example awards or media).
#
#  RULES THAT KEEP THE PAGE WORKING
#    * The spaces at the start of each line matter. Line new lines up exactly
#      with the ones around them. Use spaces, never tabs.
#    * Put titles inside "double quotes".
#    * Write the abstract on the lines below "abstract: |", indented like the
#      others, with a blank line between paragraphs.
#    * A link to one of your own files looks like files/NAME.pdf (upload the
#      file to the files folder first). Any other link is a full web address
#      starting with https://
#    * Lines starting with # (like these) are notes and never appear on the site.
#
#  EVERY FIELD A PAPER CAN HAVE (only "title" is required)
#
#    - title: "Paper title"
