- section: Regulation and enforcement in the financial sector
  papers:

    - title: "Threat of entry and the use of discretion in banks' financial reporting"
      url: https://www.sciencedirect.com/science/article/pii/S0165410118300387
      journal: Journal of Accounting and Economics
      citation: 2019, 67(1), 1-35
      image: files/Threat_of_entry.jpg
      image_alt: "Map of the United States with locations marked by red dots"
      abstract: |
        This paper studies managers' use of accounting discretion to deter entry. Using state-level changes in branching regulation under the Interstate Banking and Branching Efficiency Act, I find geographically-constrained community banks increased their loan loss provisions to appear less profitable when faced with the threat of entry by competitors. Additional tests rule out alternative explanations that firm economics or regulators drove the increase. I complement my analyses with survey-based evidence. Findings from the survey confirm that banks prefer to locate in markets where incumbents have high profitability and low credit losses, and that banks use competitors' financial statements to analyze competition.
      note: "As part of this study, I conducted a survey of community bankers. Details related to the survey can be found in Appendix A of the paper, as well as here:"
      materials:
        - label: Competition in Community Banking Survey
          url: files/survey.pdf
        - label: Survey Instrument
          url: files/survey_tool.pdf
      media:
        - title: "Do Companies Camouflage Their Results to Scare Off Competitors?"
          outlet: Chicago Booth Review
          date: April 19, 2017
          url: https://www.chicagobooth.edu/review/do-companies-camouflage-their-results-scare-competitors?sc_lang=en

    - title: "Observing Enforcement: Evidence from Banking"
      url: https://onlinelibrary.wiley.com/doi/10.1111/1475-679X.12422
      coauthors: Anya Kleymenova
      journal: Journal of Accounting Research
      citation: 2022, 60(4), 1583-1633
      image: files/Observing_enforcement.png
      image_alt: "Chart of the number of enforcement decisions and orders (EDOs) per year, 1990 to 2017, with their mean and median length"
      abstract: |
        This paper finds that the disclosure of supervisory actions by bank regulators is associated with changes in their enforcement behavior. Using a novel sample of enforcement decisions and orders (EDOs) and a change in the disclosure regime, we find that regulators issue more EDOs, intervene sooner, and rely more on publicly observable signals following the regime change. EDO documents become longer, more complex, and contain more boilerplate language. Our results also indicate that intervention happens sooner and more frequently in counties with higher news circulation, which suggests that regulators take into account the public perception of their actions. We evaluate potentially confounding factors, including the savings and loan (S&L) crisis and competition from thrifts, and find robust results. We also study bank outcomes and document that uninsured deposits decline at EDO banks in the disclosure regime, especially for those covered in the news. Finally, we observe that bank failure accelerates despite improvements in capital ratios and asset quality. Overall, our research provides new insights on the disclosure of regulatory actions.
      materials:
        - label: Online Appendix
          url: files/KT_Observing_Enforcement_OnlineAppendix.pdf
      awards:
        - "2019 Bureau Van Dijk Best Paper Award in Banking, Sydney Banking and Financial Stability Conference"
        - "2020 EFA Best Paper Award"
      media:
        - title: "Banking Regulators Operate Differently under Public Scrutiny"
          outlet: Chicago Booth Review
          date: October 01, 2020
          url: https://www.chicagobooth.edu/review/banking-regulators-operate-differently-under-public-scrutiny?sc_lang=en

    - title: "Bank Supervision and Organizational Capital: The Case of Minority Lending"
      url: https://doi.org/10.1111/1475-679X.12529
      coauthors: Byeongchan An, Robert Bushman and Anya Kleymenova
      journal: Journal of Accounting Research
      citation: 2024, 62(2), 505-549
      image: files/Bank_supervision.png
      image_alt: "Bar charts of changes in mortgage portfolio share and market share for minority and Black or African American borrowers during and after EDOs"
      abstract: |
        Racial disparities in mortgage lending have important welfare implications. We investigate whether improvements in banks' organizational capital and associated control systems facilitate increased lending to minority borrowers. We focus on bank supervisors' enforcement decisions and orders (EDOs) against banks, which can enforce changes in banks' internal processes, procedures, and management practices. We hypothesize that EDO-imposed improvements in loan policies, internal governance, and employee training mitigate deficiencies in credit assessments and lending decisions that previously disadvantaged minority borrowers. We find that relative to white borrowers, mortgage lending to minority borrowers significantly increases following the resolution of EDOs, where this positive effect increases with the strictness of bank supervisors and the severity of the EDO. Using a semi-supervised machine learning method to analyze and quantify the text of EDOs, we find that increases in minority lending are significantly higher for EDOs specifying revisions of loan policies, implementation of formal internal governance procedures, or more employee training, especially in areas with a high proportion of subprime borrowers. Overall, we find that EDO-driven improvements in organizational capital generate unintended, positive social externalities that enhance access to credit for minority borrowers.
      materials:
        - label: Online Appendix
          url: files/ABKT_Online_Appendix.pdf
      media:
        - title: "How Fixing Troubled Banks Can Help Minorities and Women"
          outlet: Chicago Booth Review
          date: October 03, 2022
          url: https://www.chicagobooth.edu/review/how-fixing-troubled-banks-can-help-minorities-women?sc_lang=en
        - title: "Insights/Research Brief"
          outlet: Becker Friedman Institute
          date: February 23, 2023
          url: https://bfi.uchicago.edu/insight/research-summary/bank-supervision-and-managerial-control-systems-the-case-of-minority-lending/

    - title: "Trust in Banks and Borrower Behavior"
      url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5384682
      coauthors: Samuel Chang and Jizhou Wang
      status: Working paper
      image: files/Trust_in_banks.png
      image_alt: "Line chart of the probability of loan delinquency by months since origination, for loans made before, during and after an EDO and for control loans"
      abstract: |
        We examine how trust shapes retail borrowers' decisions to transact with banks, using regulatory enforcement actions as reputational shocks that erode consumers' confidence. Survey data confirm that enforcement actions are associated with significant declines in trust in banks and bankers. Using granular loan data from TransUnion linking borrowers to lenders, we find that higher-quality borrowers exit sanctioned banks. Consistent with a trust-based mechanism, higher-quality borrowers also leave unsanctioned banks and migrate to nonbank financial institutions, reducing their overall exposure to the banking sector. Sanctioned banks retain fewer repeat borrowers, and the shift toward lower-quality borrowers intensifies as survey-based trust declines and local news coverage becomes negative. In contrast, borrower quality shows little change when local news is positive or conveys trust, and in regions without local news outlets, underscoring the media's role in contextualizing news and shaping consumers' trust. Additional tests indicate these findings are inconsistent with supply-side explanations.
      media:
        - title: "Insights/Research Brief"
          outlet: Becker Friedman Institute
          date: August 27, 2025
          url: https://bfi.uchicago.edu/insights/trust-in-banks-and-borrower-behavior-evidence-from-supervisory-actions-and-local-information-quality/

    - title: "Bank Regulators and Climate Action: Evidence from Supervisory Guidance"
      url: files/Central_bank_climate.pdf
      coauthors: Kirill Skobelev
      status: Working paper
      image: files/bank_regulators.png
      image_alt: "Heat maps of coefficients on comments' climate engagement, by simulated regulator role and language model, for U.S. bank regulators and the SEC"
      abstract: |
        U.S. bank regulators generally view their role as overseeing banks' exposure to climate-related risks rather than actively shaping climate policy. However, the boundary between risk oversight and policy advocacy is a gray area. We examine how U.S. bank regulators navigate this boundary by analyzing the rulemaking process for the 2023 interagency guidance on climate-related financial risk management. Our analysis consists of two parts.

        First, we examine the role of public pressure in shaping the final guidance. Using large language models (LLMs) to classify the public comments submitted on the draft, we find that the comments are highly polarized: the majority of individuals and climate advocacy groups support climate action by bank regulators, while banks and banking associations oppose it. We then construct textual alignment measures between each comment and the corresponding paragraphs in the draft and final guidance, and find that highly climate-engaged comments are less likely to be reflected in the final version, suggesting regulators discounted pro-climate advocacy.

        Second, we use LLMs to simulate regulators operating under different incentives. We implement a two-stage procedure in which the LLM first decides which public comments a regulator in a given role would accept, then revises the draft guidance using only those accepted comments. The evidence at the first stage is robust: both commercial and fine-tuned LLMs systematically accept or reject comments in line with their assigned role. In the second stage, we find suggestive evidence that regulators' revisions resemble those of a risk-averse bureaucrat most closely. However, the second stage outcomes are sensitive to the choice of model, echoing cautions in the literature on using LLMs as human surrogates.


