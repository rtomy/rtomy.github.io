    - title: "Accounting and the Informal Economy: A Review and Discussion"
      url: https://doi.org/10.1016/j.jacceco.2026.101927
      journal: Journal of Accounting and Economics
      citation: Forthcoming
      abstract: |
        This paper discusses Aguilar, Lind, and Ramesh’s study of accounting practices in the informal economy. Using survey data from the International Labour Organization (ILO), the authors document that a substantial fraction of informal microenterprises in Central America voluntarily maintain accounting records, and that accounting quality is associated with owner characteristics, financing choices, access to credit, and business expansion plans. I situate these findings within the broader literature on informality and on the role of accounting in economic development, and argue that the paper opens up a promising agenda for accounting research in developing economies. I also outline directions for future work, including the need for research that can identify the causal effect of accounting on economic development.

    - title: "Banking on Trust: Supervisory Transparency and Depositors' Actions"
      url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4586886
      coauthors: Abhiman Das and Tanmoy Majilla
      status: Working paper
      image: files/treatment_map.png
      image_alt: "Map of India with bank branch locations marked in two colors"
      abstract: |
        We explore the role of institutional trust in influencing depositors' reactions to bank supervisory actions in India. Utilizing a unique event that led to unexpected penalties on banks and the quasi-random nature of branch locations, we find news of penalties on some banks leading to deposit withdrawals from offending and neighboring nonoffending branches. Such withdrawals are more pronounced in regions with lower trust in public institutions, including trust in courts and banks. Trust is associated with information access and the quality of local services. We find limited evidence that credit and economic activity also decline in regions with deposit withdrawals.
      media:
